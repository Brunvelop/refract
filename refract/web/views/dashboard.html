<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refract — Dev Tools</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #6366f1;
            --accent-light: #eef2ff;
            --green: #22c55e;
            --red: #ef4444;
            --badge-api: #dbeafe;
            --badge-api-text: #1d4ed8;
            --badge-cli: #dcfce7;
            --badge-cli-text: #15803d;
            --badge-mcp: #fae8ff;
            --badge-mcp-text: #7e22ce;
            --badge-sse: #fef3c7;
            --badge-sse-text: #b45309;
            --radius: 0.75rem;
            --radius-sm: 0.375rem;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.9375rem;
            line-height: 1.5;
        }

        /* ── Layout ── */
        .shell {
            max-width: 72rem;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo { font-size: 1.5rem; }
        .project-name {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text);
        }
        .project-name span { color: var(--accent); }

        .health-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
        }
        .health-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: #cbd5e1;
            flex-shrink: 0;
        }
        .health-dot.ok { background: var(--green); }
        .health-dot.error { background: var(--red); }

        /* ── Quick Links ── */
        .links-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.75rem;
        }
        .link-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.875rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: background 0.15s, border-color 0.15s;
        }
        .link-chip:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 0.75rem;
        }
        .card-title {
            font-size: 0.9375rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-count {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            background: var(--accent-light);
            color: var(--accent);
        }
        .card-body { padding: 1.25rem; }

        /* ── Registry table ── */
        .registry-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        .registry-table th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .registry-table td {
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .registry-table tr:last-child td { border-bottom: none; }
        .registry-table tr:hover td { background: var(--bg); }

        .fn-name {
            font-family: ui-monospace, monospace;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--accent);
        }
        .fn-desc { color: var(--muted); font-size: 0.8125rem; }
        .fn-methods { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); }

        .badges { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge-api  { background: var(--badge-api);  color: var(--badge-api-text); }
        .badge-cli  { background: var(--badge-cli);  color: var(--badge-cli-text); }
        .badge-mcp  { background: var(--badge-mcp);  color: var(--badge-mcp-text); }
        .badge-sse  { background: var(--badge-sse);  color: var(--badge-sse-text); }

        /* ── MCP panel ── */
        .mcp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 640px) { .mcp-grid { grid-template-columns: 1fr; } }

        .mcp-stat {
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
        }
        .mcp-stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 0.375rem;
        }
        .mcp-stat-value {
            font-family: ui-monospace, monospace;
            font-size: 0.8125rem;
            color: var(--text);
            word-break: break-all;
        }
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.375rem;
            padding: 0.25rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s;
        }
        .copy-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

        /* ── Auto-elements grid ── */
        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr));
            gap: 1rem;
        }

        /* ── Loading / empty ── */
        .placeholder {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
            font-size: 0.875rem;
        }
        .hidden { display: none !important; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .registry-table thead { display: none; }
            .registry-table td { display: block; padding: 0.375rem 0.75rem; }
            .registry-table tr { padding: 0.5rem 0; display: block; border-bottom: 1px solid var(--border); }
            .registry-table tr:last-child { border-bottom: none; }
        }
    </style>

    <!-- Web Components -->
    <script type="module" src="/refract/generator.js"></script>
</head>
<body>
<div class="shell">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="logo">🔬</span>
            <h1 class="project-name">
                <span id="projectName">Refract</span> — Dev Tools
            </h1>
        </div>
        <div id="healthBadge" class="health-badge">
            <span class="health-dot" id="healthDot"></span>
            <span id="healthText">checking…</span>
        </div>
    </header>

    <!-- Quick links -->
    <nav class="links-bar">
        <a class="link-chip" href="/docs" target="_blank">📖 Swagger UI</a>
        <a class="link-chip" href="/redoc" target="_blank">📄 ReDoc</a>
        <a class="link-chip" href="/mcp" target="_blank" id="mcpLink">🤖 MCP endpoint</a>
        <a class="link-chip" href="/health" target="_blank">❤️ Health</a>
        <a class="link-chip" href="/functions/details" target="_blank">🗂️ Schema JSON</a>
    </nav>

    <!-- Registry overview -->
    <div class="card" id="registryCard">
        <div class="card-header">
            <span class="card-title">
                📋 Registry
                <span class="card-count" id="fnCount">—</span>
            </span>
        </div>
        <div id="registryLoading" class="placeholder">Loading registry…</div>
        <table class="registry-table hidden" id="registryTable">
            <thead>
                <tr>
                    <th>Function</th>
                    <th>Description</th>
                    <th>Methods</th>
                    <th>Interfaces</th>
                </tr>
            </thead>
            <tbody id="registryBody"></tbody>
        </table>
    </div>

    <!-- MCP info -->
    <div class="card" id="mcpCard">
        <div class="card-header">
            <span class="card-title">🤖 MCP</span>
            <span class="card-count" id="mcpCount">— tools</span>
        </div>
        <div class="card-body">
            <div class="mcp-grid">
                <div class="mcp-stat">
                    <div class="mcp-stat-label">HTTP Endpoint</div>
                    <div class="mcp-stat-value" id="mcpEndpoint">/mcp</div>
                    <button class="copy-btn" onclick="copyMcpUrl()">📋 Copy URL</button>
                </div>
                <div class="mcp-stat">
                    <div class="mcp-stat-label">Connect from MCP client</div>
                    <div class="mcp-stat-value" id="mcpConnectStr">mcp+http://localhost:8000/mcp</div>
                    <button class="copy-btn" onclick="copyMcpConnect()">📋 Copy</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Interactive auto-elements -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">⚡ Interactive</span>
        </div>
        <div class="card-body">
            <div id="elementsLoading" class="placeholder">Loading elements…</div>
            <div class="elements-grid hidden" id="elementsContainer"></div>
        </div>
    </div>

</div>

<script type="module">
    // ── Data fetch ──────────────────────────────────────────────────────────

    async function fetchHealth() {
        try {
            const r = await fetch('/health');
            const d = await r.json();
            document.getElementById('healthDot').className =
                'health-dot ' + (d.status === 'healthy' ? 'ok' : 'error');
            document.getElementById('healthText').textContent =
                d.status === 'healthy'
                    ? `healthy · ${d.functions} fn`
                    : d.status;
        } catch {
            document.getElementById('healthDot').className = 'health-dot error';
            document.getElementById('healthText').textContent = 'unreachable';
        }
    }

    async function fetchFunctions() {
        const r = await fetch('/functions/details');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    }

    // ── Registry table ──────────────────────────────────────────────────────

    function renderRegistry(functions, projectName) {
        // Project name in header
        if (projectName) {
            document.getElementById('projectName').textContent = projectName;
            document.title = `${projectName} — Refract Dev Tools`;
        }

        const entries = Object.values(functions);
        document.getElementById('fnCount').textContent = `${entries.length} functions`;

        const tbody = document.getElementById('registryBody');
        tbody.innerHTML = '';

        for (const fn of entries) {
            const tr = document.createElement('tr');

            // Function name
            const tdName = document.createElement('td');
            tdName.innerHTML = `<span class="fn-name">${fn.name}</span>`;

            // Description
            const tdDesc = document.createElement('td');
            tdDesc.innerHTML = `<span class="fn-desc">${fn.description || '—'}</span>`;

            // HTTP methods
            const tdMethods = document.createElement('td');
            tdMethods.innerHTML = `<span class="fn-methods">${(fn.http_methods || []).join(', ')}</span>`;

            // Interface badges
            const tdBadges = document.createElement('td');
            const badges = document.createElement('div');
            badges.className = 'badges';
            (fn.interfaces || []).forEach(iface => {
                const b = document.createElement('span');
                b.className = `badge badge-${iface}`;
                b.textContent = iface;
                badges.appendChild(b);
            });
            if (fn.streaming) {
                const b = document.createElement('span');
                b.className = 'badge badge-sse';
                b.textContent = 'SSE';
                badges.appendChild(b);
            }
            tdBadges.appendChild(badges);

            tr.appendChild(tdName);
            tr.appendChild(tdDesc);
            tr.appendChild(tdMethods);
            tr.appendChild(tdBadges);
            tbody.appendChild(tr);
        }

        document.getElementById('registryLoading').classList.add('hidden');
        document.getElementById('registryTable').classList.remove('hidden');
    }

    // ── MCP section ─────────────────────────────────────────────────────────

    function renderMcp(functions) {
        const mcpTools = Object.values(functions).filter(f =>
            (f.interfaces || []).includes('mcp')
        );
        document.getElementById('mcpCount').textContent = `${mcpTools.length} tools`;

        const base = `${location.protocol}//${location.host}`;
        document.getElementById('mcpEndpoint').textContent = `${base}/mcp`;
        document.getElementById('mcpConnectStr').textContent = `mcp+http://${location.host}/mcp`;
    }

    // ── Auto-elements ────────────────────────────────────────────────────────

    async function renderElements(functions) {
        // Wait for generator
        let attempts = 0;
        while (!window.autoElementGenerator && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
        }

        const container = document.getElementById('elementsContainer');
        container.innerHTML = '';

        for (const funcName of Object.keys(functions)) {
            const el = document.createElement(`auto-${funcName.replace(/_/g, '-')}`);
            container.appendChild(el);
        }

        document.getElementById('elementsLoading').classList.add('hidden');
        container.classList.remove('hidden');
    }

    // ── MCP availability check ───────────────────────────────────────────────

    async function checkMcpAvailable() {
        try {
            const r = await fetch('/mcp', { method: 'HEAD' });
            return r.status !== 404;
        } catch {
            return false;
        }
    }

    // ── Copy helpers ─────────────────────────────────────────────────────────

    window.copyMcpUrl = () => {
        const val = document.getElementById('mcpEndpoint').textContent;
        navigator.clipboard?.writeText(val);
    };
    window.copyMcpConnect = () => {
        const val = document.getElementById('mcpConnectStr').textContent;
        navigator.clipboard?.writeText(val);
    };

    // ── Init ─────────────────────────────────────────────────────────────────

    async function init() {
        fetchHealth();

        // Check MCP availability in parallel with function fetch
        const [data, mcpAvailable] = await Promise.allSettled([
            fetchFunctions(),
            checkMcpAvailable(),
        ]);

        // Hide MCP UI elements if /mcp is not mounted
        if (mcpAvailable.status === 'fulfilled' && !mcpAvailable.value) {
            document.getElementById('mcpLink').classList.add('hidden');
            document.getElementById('mcpCard').classList.add('hidden');
        }

        if (data.status === 'rejected') {
            console.error('Dashboard init error:', data.reason);
            document.getElementById('registryLoading').textContent = `❌ ${data.reason.message}`;
            document.getElementById('elementsLoading').textContent = `❌ ${data.reason.message}`;
            return;
        }

        try {
            const functions = data.value.functions || {};
            const projectName = data.value.project || 'Refract';

            renderRegistry(functions, projectName);
            if (mcpAvailable.value) renderMcp(functions);
            await renderElements(functions);
        } catch (err) {
            console.error('Dashboard render error:', err);
            document.getElementById('registryLoading').textContent = `❌ ${err.message}`;
            document.getElementById('elementsLoading').textContent = `❌ ${err.message}`;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
